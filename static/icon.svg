<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente do Fundo (Preto Ônix Tecnológico) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Gradiente Vermelho Alerta Carmesim Vibrante -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53"/>
      <stop offset="100%" stop-color="#c81e32"/>
    </linearGradient>

    <!-- Gradiente Branco Platina -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Sombra Suave Profissional -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff3b53" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Suave Estilo App Moderno (Android / iOS) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="#262730" stroke-width="3"/>

  <!-- Brilho Perimetral de Borda Superior -->
  <path d="M 128 22 Q 256 20 384 22" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- GRUPO DO MONOGRAMA AU ESTILIZADO -->
  <g filter="url(#dropShadow)">
    
    <!-- 1. O CORPO DO "A" EM BRANCO PLATINA (Chevron de Navegação / Escudo de Alerta) -->
    <!-- Haste esquerda e ápice fluindo em curva -->
    <path d="M 124 370 
             L 256 112 
             L 388 370 
             L 334 370 
             L 256 218 
             L 178 370 
             Z" 
          fill="url(#whiteGrad)"/>

    <!-- 2. O CORPO DO "U" EM VERMELHO ALERTA (Abraçando o Centro e Descendo em Curva Fluida) -->
    <!-- O U se integra organicamente dentro e abaixo do A -->
    <path d="M 212 250 
             L 212 334 
             C 212 368, 230 388, 256 388 
             C 282 388, 300 368, 300 334 
             L 300 250 
             L 338 250 
             L 338 334 
             C 338 392, 302 424, 256 424 
             C 210 424, 174 392, 174 334 
             L 174 250 
             Z" 
          fill="url(#redGrad)" 
          filter="url(#glowRed)"/>

    <!-- 3. RADAR BEACON / PINO DE GPS NO ÁPICE (O "Olho" de Alerta) -->
    <circle cx="256" cy="180" r="16" fill="url(#redGrad)"/>
    <circle cx="256" cy="180" r="7" fill="#ffffff"/>
  </g>
</svg>
